[package]
name = "rnote-android"
description = "JNI bridge exposing rnote-engine to the Android viewer app"
publish = false
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rnote-compose = { workspace = true }
rnote-engine = { workspace = true }

anyhow = { workspace = true }
cairo-rs = { workspace = true }
futures = { workspace = true }
parry2d-f64 = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

# Lints referenced by the Google Rust Style Guide, plus documented unsafe.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
borrowed_box = "warn"
len_without_is_empty = "warn"
new_without_default = "warn"
ptr_arg = "warn"
should_implement_trait = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
wrong_self_convention = "warn"
